name: Deploy browser editor

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "assets/skylanders_db.json"
      - "assets/vehicle_fresh_templates.json"
      - "assets/skylander-character-editor.png"
      - "assets/portraits/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p site/assets/portraits
          cp -R web/. site/
          cp assets/skylanders_db.json assets/vehicle_fresh_templates.json assets/skylander-character-editor.png site/assets/
          cp assets/portraits/*.png site/assets/portraits/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
