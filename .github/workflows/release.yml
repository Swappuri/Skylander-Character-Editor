name: Build and publish release assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            asset: macos-arm64
            data_separator: ":"
            kind: mac
          - name: macOS Intel
            os: macos-15-intel
            asset: macos-x86_64
            data_separator: ":"
            kind: mac
          - name: Windows x86-64
            os: windows-latest
            asset: windows-x86_64
            data_separator: ";"
            kind: windows
          - name: Linux x86-64
            os: ubuntu-22.04
            asset: linux-x86_64
            data_separator: ":"
            kind: linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build app
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --name "Skylander Character Editor"
          --collect-all cryptography
          --collect-all tkinterdnd2
          --add-data "assets${{ matrix.data_separator }}assets"
          src/skylander_character_editor.py

      - name: Package macOS disk image
        if: matrix.kind == 'mac'
        shell: bash
        run: |
          mkdir -p dmg-root
          cp -R "dist/Skylander Character Editor.app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create \
            -volname "Skylander Character Editor" \
            -srcfolder dmg-root \
            -ov -format UDZO \
            "Skylander-Character-Editor-${{ matrix.asset }}.dmg"

      - name: Package Windows installer
        if: matrix.kind == 'windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_VERSION -replace '^v', ''
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "installer\windows.iss"
          Move-Item "dist\Skylander-Character-Editor-windows-x86_64-Setup.exe" "."

      - name: Package Linux AppImage
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse2
          mkdir -p AppDir/usr/lib/skylander-character-editor
          cp -a "dist/Skylander Character Editor/." AppDir/usr/lib/skylander-character-editor/
          cp installer/linux/AppRun AppDir/AppRun
          cp installer/linux/skylander-character-editor.desktop AppDir/skylander-character-editor.desktop
          python - <<'PY'
          from PIL import Image, ImageDraw
          image = Image.new("RGBA", (256, 256), "#15181c")
          draw = ImageDraw.Draw(image)
          draw.rounded_rectangle((12, 12, 244, 244), radius=48, fill="#20252b", outline="#51d4d0", width=10)
          draw.ellipse((62, 62, 194, 194), outline="#51d4d0", width=14)
          draw.ellipse((101, 101, 155, 155), fill="#51d4d0")
          image.save("AppDir/skylander-character-editor.png")
          PY
          chmod +x AppDir/AppRun
          curl -fL --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            -o appimagetool
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool AppDir "Skylander-Character-Editor-${{ matrix.asset }}.AppImage"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Skylander-Character-Editor-${{ matrix.asset }}
          path: Skylander-Character-Editor-${{ matrix.asset }}*
          if-no-files-found: error


  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: Skylander-Character-Editor-*
          path: release-assets
          merge-multiple: true

      - name: Publish release with all platform packages
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/*.AppImage
